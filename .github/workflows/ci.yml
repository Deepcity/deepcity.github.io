name: CI

permissions:
  contents: read

on:
  pull_request:
    types:
      - opened
      - edited
      - synchronize
      - reopened
  workflow_call:

jobs:
  build:
    name: Code standards & build
    runs-on: ubuntu-latest
    timeout-minutes: 3

    strategy:
      matrix:
        node-version: [20]

    steps:
      - name: "☁️ Checkout repository"
        uses: actions/checkout@v4
        with:
          # Full history so the agent can diff the PR against its base branch.
          fetch-depth: 0

      - name: "📦 Install pnpm"
        uses: pnpm/action-setup@v4
        with:
          version: 10.11.1

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: "pnpm"

      - name: "📦 Install dependencies"
        run: pnpm install

      # Read-only: verifies that every changed post has a fresh, committed
      # sidecar. Never writes to the tree and never calls an LLM, so it needs
      # no secrets and is safe to fail the PR on.
      - name: "🤖 Verify blog agent artifacts"
        run: |
          mkdir -p .tmp
          ./agent --changed --base "origin/${{ github.base_ref || 'main' }}" --mode ci --strict --report-file .tmp/blog-agent-report.json

      - name: "🧾 Upload blog agent report"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: blog-agent-report
          path: .tmp/blog-agent-report.json
          if-no-files-found: ignore

      - name: "🔎 Lint code"
        run: pnpm run lint

      - name: "📝 Checking code format"
        run: pnpm run format:check

      - name: "🚀 Build the project"
        run: pnpm run build
