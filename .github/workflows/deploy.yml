name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Install dependencies
        run: pnpm install

      # Read-only audit of the committed sidecars. The site is always built
      # from exactly what is in the repository; stale sidecars are reported in
      # the artifact but do not block the deploy. Regenerate them locally with
      # `./agent --all` and commit.
      - name: Audit blog agent artifacts
        run: |
          mkdir -p .tmp
          ./agent --all --mode ci --report-file .tmp/blog-agent-report.json

      - name: Upload blog agent report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: blog-agent-report
          path: .tmp/blog-agent-report.json
          if-no-files-found: ignore

      - name: Build Astro site
        run: pnpm run build

      - name: Normalize Pages artifact permissions
        run: chmod -R u+rwX,go+rX dist

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
